<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Birthday Surprise</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600;700&family=Inter:wght@400;500;600;700;800&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body class="landing-page">
    <audio id="bg-music" src="assets/birthday-music.mp3" preload="auto" loop aria-hidden="true"></audio>
    <main class="scene">
      <div class="ambient ambient-left"></div>
      <div class="ambient ambient-right"></div>

      <section class="hero-panel">
        <p class="eyebrow">A little sparkle made just for you</p>
        <h1>Happy Birthday Krishu</h1>
        <p class="subtitle">
          Make a wish, blow the candles in your heart, and open the surprise waiting below.
        </p>

        <div class="cake-wrap" aria-label="Birthday cake with candles and firecrackers">
          <div class="spark spark-one"></div>
          <div class="spark spark-two"></div>
          <div class="spark spark-three"></div>
          <div class="spark spark-four"></div>

          <div class="cake-shadow"></div>
          <div class="cake">
            <div class="drip drip-one"></div>
            <div class="drip drip-two"></div>
            <div class="drip drip-three"></div>
            <div class="candles">
              <span class="candle candle-one"><span class="flame"></span></span>
              <span class="candle candle-two"><span class="flame"></span></span>
              <span class="candle candle-three"><span class="flame"></span></span>
            </div>
            <div class="icing"></div>
            <div class="middle-layer">
              <span class="frosting"></span>
            </div>
            <div class="base-layer">
              <span class="frosting frost-a"></span>
              <span class="frosting frost-b"></span>
            </div>
            <div class="plate"></div>
          </div>
        </div>

        <a class="surprise-btn" href="surprise.html">Open Your Surprise</a>
      </section>
    </main>

    <script src="script.js"></script>
  </body>
</html>
