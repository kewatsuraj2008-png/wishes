<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>For Krishu</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600;700&family=Inter:wght@400;500;600;700;800&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body class="surprise-page">
    <main class="scene surprise-scene">
      <div class="ambient ambient-left"></div>
      <div class="ambient ambient-right"></div>

      <section class="surprise-panel">
        <p class="eyebrow">Candles out, wishes on</p>
        <h1>For Krishu, with love</h1>
        <p class="subtitle">
          Your candle has been gently blown out, but the warmth, love, and good wishes keep shining brighter.
        </p>

        <div class="wish-banner">
          <p>
            May Krishu always stay surrounded by kindness, confidence, joy, and beautiful moments that become
            unforgettable memories.
          </p>
        </div>

        <div class="photo-gallery" aria-label="Photo gallery for Krishu">
          <figure class="photo-card photo-card-large">
            <img src="assets/krishu-1.jpeg" alt="Krishu smiling in a casual portrait" loading="lazy" decoding="async" />
          </figure>
          <figure class="photo-card">
            <img src="assets/krishu-2.jpeg" alt="Krishu smiling in a dark printed outfit" loading="lazy" decoding="async" />
          </figure>
          <figure class="photo-card">
            <img src="assets/krishu-3.jpeg" alt="Krishu with a bright sunflower filter and a soft smile" loading="lazy" decoding="async" />
          </figure>
          <figure class="photo-card">
            <img src="assets/krishu-4.jpeg" alt="Krishu smiling outdoors in a floral dupatta" loading="lazy" decoding="async" />
          </figure>
          <figure class="photo-card">
            <img src="assets/krishu-5.jpeg" alt="Krishu wearing glasses with a playful expression" loading="lazy" decoding="async" />
          </figure>
          <figure class="photo-card photo-card-wide">
            <img src="assets/krishu-6.jpeg" alt="Krishu smiling beside a wooden doorway" loading="lazy" decoding="async" />
          </figure>
        </div>

        <div class="cake-reveal" aria-label="Cake with candles turned off">
          <div class="cake-shadow"></div>
          <div class="cake cake-muted">
            <div class="drip drip-one"></div>
            <div class="drip drip-two"></div>
            <div class="drip drip-three"></div>
            <div class="candles candles-off">
              <span class="candle candle-one"><span class="flame flame-off"></span></span>
              <span class="candle candle-two"><span class="flame flame-off"></span></span>
              <span class="candle candle-three"><span class="flame flame-off"></span></span>
            </div>
            <div class="icing"></div>
            <div class="middle-layer">
              <span class="frosting"></span>
            </div>
            <div class="base-layer">
              <span class="frosting frost-a"></span>
              <span class="frosting frost-b"></span>
            </div>
            <div class="plate"></div>
          </div>
        </div>

        <a class="surprise-btn ghost" href="index.html">Back to candle glow</a>
      </section>
    </main>
  </body>
</html>
